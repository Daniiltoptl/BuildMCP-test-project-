# BuildBridge: мост между BuildMCP (Claude) и сервером.
# Токен даёт полный доступ к миру и консоли. Никому его не показывайте.

# Адрес HTTP API. 127.0.0.1 = доступ только с этой машины (рекомендуется).
# Если Claude работает на другом компьютере, поставьте 0.0.0.0 и откройте порт
# (лучше через SSH-туннель или VPN) и заполните allowed-ips.
bind: 127.0.0.1
port: 8765

# Сгенерируется при первом запуске. Впишите его в настройки плагина BuildMCP (bridge_token).
token: ""

# Если список не пуст, запросы принимаются только с этих IP.
allowed-ips: []

# Сколько миллисекунд за тик мост может тратить на вставку (из 50 мс тика).
# Больше = быстрее вставка, но возможны просадки TPS.
max-tick-millis: 20

# Ограничения размера одной вставки.
max-upload-mb: 512
max-cells: 50000000

backups:
  # Бэкап вставляемой области перед каждой вставкой (для /bb undo и server_undo).
  enabled: true
  # Сколько последних бэкапов хранить.
  keep: 30
