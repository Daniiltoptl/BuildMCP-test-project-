[project]
name = "buildmcp"
version = "0.1.0"
description = "Minecraft build engine + MCP server: procedural building, block-accurate rendering and live pasting of pro-level spawns"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.2,<3",
    "numpy>=1.26",
    "scipy>=1.11",
    "numba>=0.60",
    "pillow>=10.0",
    "nbtlib>=2.0",
    "httpx>=0.27",
    "trimesh>=4.0",
]

[project.scripts]
buildmcp = "buildmcp.mcp_server:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/buildmcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
